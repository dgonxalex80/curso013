<style>
/* Se incluye en todas las páginas, incluso si definen su propio CSS. */
.navbar .navbar-nav > .dropdown > .dropdown-menu {
  max-height: calc(100vh - 90px);
  overflow-y: auto;
}
.navbar .unidad-grupo > button {
  display: block;
  width: 100%;
  padding: 7px 20px;
  border: 0;
  background: transparent;
  color: #263b4b;
  font: inherit;
  font-weight: 600;
  text-align: left;
}
.navbar .unidad-grupo > button::after {
  content: "▸";
  float: right;
  margin-left: 16px;
}
.navbar .unidad-grupo > button[aria-expanded="true"]::after { content: "▾"; }
.navbar .unidad-grupo > ul {
  list-style: none;
  margin: 0;
  padding: 0 0 0 12px;
  background: #f2f6f9;
}
.navbar .unidad-grupo > ul[hidden] { display: none !important; }
.navbar .unidad-grupo > ul > li > a {
  display: block;
  padding: 7px 18px;
  color: #263b4b;
  text-decoration: none;
}
.navbar .unidad-grupo > button:hover,
.navbar .unidad-grupo > ul > li > a:hover,
.navbar .unidad-grupo > ul > li.active > a { background: #e2eaf1; }
.navbar .unidad-grupo > button:focus-visible,
.navbar .unidad-grupo > ul > li > a:focus-visible {
  outline: 2px solid #2c5697;
  outline-offset: -2px;
}
</style>
<script>
(function () {
  function prepararUnidades() {
    var pagina = decodeURIComponent(window.location.pathname.split('/').pop() || 'index.html');
    document.querySelectorAll('.navbar .navbar-nav > li > ul.dropdown-menu').forEach(function (menu, menuIndex) {
      var grupo = null;
      Array.from(menu.children).forEach(function (item, itemIndex) {
        var enlace = item.querySelector('a');
        if (enlace && enlace.getAttribute('href') === '#' && /^Unidad\s+\d+\.\d+$/.test(enlace.textContent.trim())) {
          var boton = document.createElement('button');
          boton.type = 'button';
          boton.textContent = enlace.textContent.trim();
          var lista = document.createElement('ul');
          lista.id = 'unidad-' + menuIndex + '-' + itemIndex;
          lista.hidden = true;
          boton.setAttribute('aria-controls', lista.id);
          boton.setAttribute('aria-expanded', 'false');
          item.classList.add('unidad-grupo');
          item.replaceChild(boton, enlace);
          item.appendChild(lista);
          boton.addEventListener('click', function (event) {
            event.stopPropagation();
            lista.hidden = !lista.hidden;
            boton.setAttribute('aria-expanded', String(!lista.hidden));
          });
          item.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && !lista.hidden) {
              event.preventDefault();
              event.stopPropagation();
              lista.hidden = true;
              boton.setAttribute('aria-expanded', 'false');
              boton.focus();
            }
          });
          grupo = lista;
        } else if (item.classList.contains('divider') || item.classList.contains('dropdown-header')) {
          grupo = null;
        } else if (grupo) {
          grupo.appendChild(item);
          if (enlace && decodeURIComponent(enlace.getAttribute('href')) === pagina) {
            item.classList.add('active');
            grupo.hidden = false;
            grupo.previousElementSibling.setAttribute('aria-expanded', 'true');
          }
        }
      });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', prepararUnidades);
  } else {
    prepararUnidades();
  }
})();
</script>
